<svg viewBox="0 0 1180 780" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1180" height="780" fill="#ffffff"/>

  <!-- ============ ROW 0 : Streamlit entry point ============ -->
  <rect x="385" y="30" width="380" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="575" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Streamlit UI (app.py)</text>
  <text x="575" y="78" text-anchor="middle" font-size="11" fill="#065f46">sidebar upload  +  chat-style ask</text>

  <line x1="450" y1="100" x2="290" y2="146" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="100" x2="830" y2="146" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ROW 1 : FastAPI endpoints ============ -->
  <rect x="135" y="150" width="300" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="285" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">FastAPI</text>
  <text x="285" y="198" text-anchor="middle" font-size="11" fill="#312e81">POST /ingest</text>

  <rect x="675" y="150" width="300" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="825" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">FastAPI</text>
  <text x="825" y="198" text-anchor="middle" font-size="11" fill="#312e81">POST /ask</text>

  <line x1="285" y1="220" x2="285" y2="266" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="825" y1="220" x2="825" y2="262" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ROW 2 : processing / decision ============ -->
  <rect x="135" y="270" width="300" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="285" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">PyMuPDF</text>
  <text x="285" y="316" text-anchor="middle" font-size="11" fill="#334155">extract text, per page</text>

  <polygon points="825,265 995,310 825,355 655,310" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="825" y="306" text-anchor="middle" font-size="11.5" font-weight="600" fill="#78350f">Page number</text>
  <text x="825" y="321" text-anchor="middle" font-size="11.5" font-weight="600" fill="#78350f">mentioned?</text>

  <!-- branch: extract text -> two paths -->
  <line x1="240" y1="340" x2="150" y2="396" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="340" x2="420" y2="396" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- branch: decision -> NO (left) / YES (right) -->
  <line x1="655" y1="310" x2="690" y2="396" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="365" font-size="11" fill="#b91c1c" font-weight="700">no</text>

  <line x1="995" y1="310" x2="960" y2="396" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="985" y="365" font-size="11" fill="#059669" font-weight="700">yes</text>

  <!-- ============ ROW 3 : four parallel steps ============ -->
  <rect x="40" y="400" width="220" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="150" y="432" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">sentence-transformers</text>
  <text x="150" y="450" text-anchor="middle" font-size="11" fill="#334155">embeds the text (CPU)</text>

  <rect x="310" y="400" width="220" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="420" y="432" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Save PDF permanently</text>
  <text x="420" y="450" text-anchor="middle" font-size="11" fill="#334155">data/papers/</text>

  <rect x="580" y="400" width="220" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="690" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">ChromaDB</text>
  <text x="690" y="450" text-anchor="middle" font-size="11" fill="#4c1d95">semantic search (top-k)</text>

  <rect x="850" y="400" width="220" height="80" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="960" y="428" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c2d12">page_lookup.py</text>
  <text x="960" y="445" text-anchor="middle" font-size="10.5" fill="#7c2d12">render page from PDF</text>
  <text x="960" y="461" text-anchor="middle" font-size="10.5" fill="#7c2d12">(or reuse cached copy)</text>

  <!-- converge col1+col2 -> chroma store -->
  <line x1="170" y1="480" x2="260" y2="526" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="480" x2="310" y2="526" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- straight down: col3 -> groq text, col4 -> groq vision -->
  <line x1="690" y1="480" x2="690" y2="526" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="480" x2="960" y2="526" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ROW 4 : storage + generation ============ -->
  <rect x="135" y="530" width="300" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="285" y="562" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">ChromaDB</text>
  <text x="285" y="580" text-anchor="middle" font-size="11" fill="#4c1d95">stores the text embeddings</text>

  <rect x="580" y="530" width="220" height="80" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="690" y="562" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">Groq</text>
  <text x="690" y="580" text-anchor="middle" font-size="11" fill="#312e81">text model</text>

  <rect x="850" y="530" width="220" height="80" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="960" y="558" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Groq</text>
  <text x="960" y="575" text-anchor="middle" font-size="10.5" fill="#7c2d12">vision model</text>
  <text x="960" y="591" text-anchor="middle" font-size="10.5" fill="#7c2d12">(thinking mode for math)</text>

  <!-- dashed connector showing "same database" between ingestion-store and query-search -->
  <line x1="435" y1="600" x2="580" y2="470" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="500" y="530" font-size="10" fill="#7c3aed" font-style="italic">same database</text>

  <!-- converge groq text + groq vision -> final answer -->
  <line x1="720" y1="610" x2="790" y2="656" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="930" y1="610" x2="860" y2="656" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ROW 5 : final answer ============ -->
  <rect x="675" y="660" width="300" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="825" y="690" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Grounded Answer</text>
  <text x="825" y="708" text-anchor="middle" font-size="11" fill="#065f46">shown in chat, with sources cited</text>

  <text x="40" y="765" font-size="11" fill="#94a3b8">PaperLens — text search by default, on-demand page rendering only when a page is explicitly named</text>
</svg>
